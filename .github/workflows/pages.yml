name: Publish SECHA website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      studio_sha: ${{ steps.source.outputs.sha }}
      publish: ${{ steps.decision.outputs.publish }}
      cache_hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Resolve public Studio+ main branch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/jplovensa/sechastudio-.git refs/heads/main | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check last successful publication
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .studio-published
          key: published-studio-v1-${{ github.sha }}-${{ steps.source.outputs.sha }}
      - name: Decide whether to publish
        id: decision
        env:
          EVENT: ${{ github.event_name }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [ "$EVENT" != schedule ] || [ "$CACHE_HIT" != true ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out Studio+
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jplovensa/sechastudio-
          ref: ${{ needs.resolve.outputs.studio_sha }}
          path: .studio-source
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test main website
        run: npm test
      - name: Build and test Studio+
        working-directory: .studio-source
        run: |
          npm ci
          npm run build
          npm test
      - name: Prepare combined static website
        run: python3 tools/prepare-site.py --studio-source .studio-source
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record successful Studio+ publication
        if: needs.resolve.outputs.cache_hit != 'true'
        env:
          STUDIO_SHA: ${{ needs.resolve.outputs.studio_sha }}
        run: printf '%s\n' "$STUDIO_SHA" > .studio-published
      - name: Save publication marker
        if: needs.resolve.outputs.cache_hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .studio-published
          key: published-studio-v1-${{ github.sha }}-${{ needs.resolve.outputs.studio_sha }}
